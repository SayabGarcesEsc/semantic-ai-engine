version: '3.8'

services:
  fastapi-ai-backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+aiomysql://ai_user:ai_password@mysql-db:3306/ai_knowledge
      - REDIS_URL=redis://redis-cache:6379/0
      - VECTOR_DB_URL=http://qdrant-vector:6333
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - mysql-db
      - redis-cache
      - qdrant-vector

  mysql-db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ai_knowledge
      MYSQL_USER: ai_user
      MYSQL_PASSWORD: ai_password
      MYSQL_ROOT_PASSWORD: root_password
    volumes:
      - mysql_data:/var/lib/mysql

  redis-cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  qdrant-vector:
    image: qdrant/qdrant:v1.8.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  mysql_data:
  redis_data:
  qdrant_data:

