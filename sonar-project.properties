sonar.projectKey=semantic-ai-engine-tcs
sonar.projectName=Semantic AI Engine Pipeline
sonar.projectVersion=1.0

sonar.sources=backend,frontend/src
sonar.tests=backend/tests,frontend/tests
sonar.exclusions=**/node_modules/**,**/venv/**,**/tests/**,**/*.config.ts

sonar.language=py
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.xml.reportPaths=backend/mutation-report.xml

sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
